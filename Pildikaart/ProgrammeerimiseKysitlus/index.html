<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmeerimise küsimustik</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
<h1>Programmeerimise küsimustik</h1>
<p>Vasta küsimustele ja vajuta nuppu „Saada“.</p>
<form id="kysitlus" onsubmit="saada(); return false;">
<table>
<thead><tr><th scope="col">Küsimus</th><th scope="col">Vastus</th></tr></thead>
<tbody>
<tr>
<td>Milliseid programmeerimiskeeli sa tead?</td>
<td><label><input type="checkbox" name="keeled" value="JavaScript" onchange="naitaKeeled()"> JavaScript</label><br>
<label><input type="checkbox" name="keeled" value="Python" onchange="naitaKeeled()"> Python</label><br>
<label><input type="checkbox" name="keeled" value="Java" onchange="naitaKeeled()"> Java</label><br>
<label><input type="checkbox" name="keeled" value="C#" onchange="naitaKeeled()"> C#</label><br>
<label><input type="checkbox" name="keeled" value="PHP" onchange="naitaKeeled()"> PHP</label><br>
<p class="vastus" id="keelteVastus" aria-live="polite"></p></td>
</tr>
<tr>
<td><label for="arvamus">Mida arvad programmeerimise õppimisest?</label></td>
<td><textarea id="arvamus" name="arvamus" rows="4" oninput="naitaArvamus()"></textarea>
<p class="vastus" id="arvamuseVastus" aria-live="polite"></p></td>
</tr>
<tr>
<td><label for="tunnid">Mitu tundi nädalas tegeled programmeerimisega?</label></td>
<td><input type="number" id="tunnid" name="tunnid" min="0" max="168" oninput="naitaTunnid()">
<p class="vastus" id="tundideVastus" aria-live="polite"></p></td>
</tr>
<tr>
<td>Kas sulle meeldib programmeerida?</td>
<td><label><input type="radio" name="meeldib" id="jah" value="Jah" onclick="naitaMeeldib()"> Jah</label>
<label><input type="radio" name="meeldib" id="ei" value="Ei" onclick="naitaMeeldib()"> Ei</label>
<img id="smile" src="roomus.svg" alt="Rõõmus nägu" width="48" height="48" hidden>
<p class="vastus" id="meeldibVastus" aria-live="polite"></p></td>
</tr>
<tr>
<td><label for="tooriistad">Milliseid programmeerimisega seotud tööriistu oskad nimetada?</label></td>
<td><input type="text" id="tooriistad" name="tooriistad" placeholder="Visual Studio Code, GitHub..." oninput="naitaTooriistad()">
<p class="vastus" id="tooriistadeVastus" aria-live="polite"></p></td>
</tr>
<tr>
<td><label for="oppida">Millist programmeerimiskeelt sooviksid kõige rohkem õppida?</label></td>
<td><select id="oppida" name="oppida" onchange="naitaValik()">
<option value="">Vali keel...</option>
<option value="JavaScript">JavaScript</option>
<option value="Python">Python</option>
<option value="Java">Java</option>
<option value="C#">C#</option>
<option value="PHP">PHP</option>
<option value="C++">C++</option>
<option value="Ruby">Ruby</option>
</select>
<p class="vastus" id="valikuVastus" aria-live="polite"></p></td>
</tr>
</tbody>
</table>
<p><button type="submit">Saada</button> <button type="button" onclick="puhasta()">Puhasta</button></p>
</form>
<h2>Kokkuvõte</h2>
<div id="kokkuvote" aria-live="polite"></div>
</main>
</body>
</html>
