<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Pildikaart - Eduard</title>

    <style>
        .pildid {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .vasak {
            width: 512px;
            flex-shrink: 0;
        }

        .parem {
            flex: 1;
            min-width: 0;
        }

        #foto {
            width: 100%;
            max-width: 500px;
            height: 512px;
            border: 0;
        }
    </style>
</head>
<body>
    <h1>Pildikaart</h1>
    <p>Vajuta esemele. Selle pilt ilmub paremale.</p>

    <div class="pildid">
        <div class="vasak">
            <img src="tumba.png" width="512" height="512"
                 usemap="#toolaud" alt="Töölaud">

            <map name="toolaud">
                <area shape="rect" coords="190,55,350,160"
                      href="notobuk.html" target="foto" alt="Sülearvuti">

                <area shape="poly"
                      coords="384,72,408,38,423,36,446,80,450,140,458,145,458,154,414,154,414,146,438,140,438,85,423,66,420,91"
                      href="lamp.html" target="foto" alt="Lamp">

                <area shape="circle" coords="386,122,32"
                      href="lill.html" target="foto" alt="Taim">

                <area shape="poly"
                      coords="77,152,188,139,188,157,352,165,460,168,509,147,509,154,462,178,77,163"
                      href="laud.html" target="foto" alt="Laud">

                <area shape="rect" coords="0,80,60,300"
                      href="tool.html" target="foto" alt="Tool">

                <area shape="rect" coords="314,179,493,442"
      href="laud.html" target="foto" alt="Laud">
            </map>
        </div>

        <div class="parem">
            <h2>Valitud ese</h2>
            <iframe id="foto" name="foto"
                    title="Valitud eseme foto"></iframe>
        </div>
    </div>
</body>
</html>
